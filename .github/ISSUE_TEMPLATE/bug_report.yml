name: Bug report
description: Report incorrect or unsafe plugin behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: prompt
    attributes:
      label: Prompt and context
      description: Share the prompt and relevant project context without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
